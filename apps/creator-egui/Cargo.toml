[package]
name = "creator-egui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "creator-egui"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
wgpu = { workspace = true }
rfd = "0.15"
pollster = "0.4"
rcad-kernel = { path = "../../libs/rcad-kernel" }
rcad-modeling = { path = "../../libs/rcad-modeling" }
rcad-render  = { path = "../../libs/rcad-render" }
rcad-scene   = { path = "../../libs/rcad-scene" }
rcad-step    = { path = "../../libs/rcad-step" }
glam.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
