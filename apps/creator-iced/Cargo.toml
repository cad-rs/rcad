[package]
name = "creator-iced"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "creator-iced"
path = "src/main.rs"

[dependencies]
glam.workspace = true
iced_aw = { version = "0.13.1", default-features = false, features = ["menu"] }
rcad-kernel = { path = "../../libs/rcad-kernel" }
rcad-modeling = { path = "../../libs/rcad-modeling" }
rcad-render  = { path = "../../libs/rcad-render" }
rcad-scene   = { path = "../../libs/rcad-scene" }
wgpu = { workspace = true }
rcad-step    = { path = "../../libs/rcad-step" }

# Native: use iced defaults (wgpu + tiny-skia both available)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { workspace = true }
rfd = "0.15"

# WASM: use only tiny-skia renderer.
# With both wgpu and tiny-skia compiled in, iced_wgpu acquires a WebGL/WebGPU
# context on the winit canvas, then softbuffer (tiny_skia) tries to acquire a
# CanvasRenderingContext2d on the SAME canvas → panic.
# Disabling wgpu means only one context type is ever requested.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { workspace = true }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
