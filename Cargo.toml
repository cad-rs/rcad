[workspace]
resolver = "2"
members = [
    "libs/rcad-kernel",
    "libs/rcad-algorithms",
    "libs/rcad-step",
    "libs/rcad-render",
    "apps/creator-egui",
    "apps/creator-iced",
]

[workspace.dependencies]
# Core math
glam = { version = "0.29", features = ["serde"] }
# Rendering
wgpu = "0.19"
# UI
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.27"
iced = { version = "0.13", default-features = false, features = ["canvas", "wgpu", "advanced", "tokio"] }
# WASM
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = "0.3"
# Data
serde = { version = "1.0", features = ["derive"] }
