[workspace]
resolver = "2"
members = [
    "libs/rcad-kernel",
    "libs/rcad-brep",
    "libs/rcad-algo",
    "libs/rcad-modeling",
    "libs/rcad-step",
    # "libs/rcad-py",
    # "libs/rcad-gds",
    # "libs/rcad-oas",
    # "libs/rcad-iges",
    # "libs/rcad-render",
    # "libs/rcad-scene",
    # "examples",
]

[workspace.dependencies]
# Core math
glam = { version = "0.29", features = ["serde"] }
# Rendering
wgpu = "27.0"
# Data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
indexmap = "2.0"
thiserror = "2.0"
laykit = "0.0"
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
bitflags = "2"
