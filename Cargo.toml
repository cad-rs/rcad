[workspace]
resolver = "2"
members = [
    "libs/rcad-kernel",
    "libs/rcad-modeling",
    "libs/rcad-algorithms",
    "libs/rcad-step",
    "libs/rcad-render",
    "libs/rcad-scene",
    "apps/creator-egui",
    "apps/creator-iced",
]

[workspace.dependencies]
# Core math
glam = { version = "0.29", features = ["serde"] }
# Rendering
wgpu = "27.0"
# UI
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.33"
iced = { version = "0.14", default-features = false, features = ["canvas", "wgpu", "advanced", "tokio"] }
# WASM
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = "0.3"
# Data
serde = { version = "1.0", features = ["derive"] }
