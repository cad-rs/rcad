[workspace]
resolver = "2"
members = [
    "libs/rcad-kernel",
    "libs/rcad-modeling",
    "libs/rcad-algorithms",
    "libs/rcad-step",
    "libs/rcad-render",
    "libs/rcad-scene",
    "libs/rcad-constraints",
    "examples",
]

[workspace.dependencies]
# Core math
glam = { version = "0.29", features = ["serde"] }
# Rendering
wgpu = "27.0"
# Data
serde = { version = "1.0", features = ["derive", "rc"] }
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
